name: Bug report / Сообщить об ошибке
description: Reproducible problem without secrets / Ошибка без секретов и полных логов
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never post license keys, POESESSID, payment data, tokens or full logs.
        Use the in-app support upload for private logs.
        Не публикуйте ключи, POESESSID, платёжные данные, токены или полные логи.
        Для приватного лога используйте встроенную отправку в поддержку.
  - type: input
    id: version
    attributes:
      label: TradeForge version / Версия TradeForge
      placeholder: 0.1.39
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Game client language / Язык клиента игры
      options: [Russian / Русский, English / Английский]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / Шаги воспроизведения
      description: Safe and redacted steps only / Только безопасные очищенные шаги.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result / Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result / Фактический результат
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Secret-data confirmation / Проверка секретов
      options:
        - label: I removed all secrets and full logs / Я удалил все секреты и полные логи.
          required: true
