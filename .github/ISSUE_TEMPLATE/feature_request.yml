name: Feature request / Предложить функцию
description: Workflow or usability improvement / Улучшение сценария или удобства
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow / Проблема или сценарий
      description: What should become easier or safer? / Что должно стать проще или безопаснее?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / Предлагаемое поведение
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation / Подтверждение
      options:
        - label: No secrets or private logs / Нет секретов или приватных логов.
          required: true
